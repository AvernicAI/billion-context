# billion-context dsh bundle layer (#949).
# Mounted automatically when the profile's package.json lists billion-context
# in dsh.profile.bundles (`dsh plugin --profile <name> add billion-context`);
# the loader resolves `name` from the profile's node_modules.
# #1772/#2474/#3354: the `auto: false` below targets the HOST-PLANE
# compaction-basic row. In profiles bundling @deepseek-ai/dsh-web-app that row
# is disabled and the running instance lives inside the agent presets, whose
# nested rows no patch layer can address by id — the preset gate rows below
# make each Web preset wait for the load-time overlay the bili-native entry
# registers (vendored from deshark42/dsh-compaction-basic-disable, MIT, #3354;
# see src/agent/dsh-compaction-disable.ts). A profile-level full-snapshot
# override of preset-standard (#2474) remains the fallback for dsh builds
# whose internal 'internal/config' hook moved.
- insert:
    - id: bili-native
      name: billion-context
- id: compaction-basic
  config:
    auto: false
# #3354: keep in sync with writeDshAcpPatch in src/launcher.ts — entry inject
# lists are REPLACED by patches, not concatenated; if a future dsh ships its
# own inject list on these entries, merge manually in BOTH layers.
# #3962: these four gate rows target the FACTORY Web preset roster ONLY. A
# profile that replaces those presets with its own ids has none of them, so all
# four rows match nothing and dsh logs `patch: entry <id> not found` at startup
# (buried in the `loader` logger, surfaced nowhere else).
#
# That miss is NOT harmless — it is a correctness risk. The inject gate is what
# keeps a preset PENDING until the overlay service publishes, i.e. what
# GUARANTEES the global internal/config middleware (src/agent/dsh-compaction-
# disable.ts) registers BEFORE that preset resolves. Per that module's own
# contract the guarantee covers only GATED ("protected") presets; an ungated
# custom preset resolves by import order, which the upstream plugin explicitly
# warns not to rely on. This is a TIMING WINDOW, not a certainty: if such a
# preset happens to resolve before the overlay registers, its compaction-basic
# AND command-compact rows may never be disabled. The direct effect is silent
# misbehavior (the preset loads, but compaction is armed when it should not be);
# the worst case is a dsh compaction checkpoint landing outside bili's knowledge
# and destroying the compression substrate (#3354/#1772/#1729) — which needs
# compaction to actually run. Your own `auto: false` blocks auto-trigger for
# compaction-basic but NOT command-compact.
#
# If your profile uses custom preset ids, SELF-GATE each one by adding
#     inject: [biliBasicCompactionPolicy]
# to every custom preset entry (or keep the factory roster). To check whether
# these factory rows applied on YOUR profile, grep the dsh loader log for
# `patch: entry ... not found`. Do NOT delete these rows: factory-roster
# profiles get a real ordering fence from them.
- id: preset-standard
  inject: [biliBasicCompactionPolicy]
- id: preset-ptc
  inject: [biliBasicCompactionPolicy]
- id: preset-minimal
  inject: [biliBasicCompactionPolicy]
- id: preset-cordis
  inject: [biliBasicCompactionPolicy]
# #2605: DSH's default retry whitelist omits MALFORMED_RESPONSE, so one
# sampling flake that breaks a tool-call argument JSON kills the whole turn
# unretried. A patch replaces the targeted row's WHOLE config (no deep
# merge), so each row restates every default code plus MALFORMED_RESPONSE —
# dropping any default code silently removes its retries. Rows absent on a
# given DSH version are skipped with a warning, never a boot failure.
- id: llm-deepseek
  config:
    retryPolicy:
      mode: normal
      retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT, MALFORMED_RESPONSE]
- id: llm-deepseek-account
  config:
    retryPolicy:
      mode: normal
      retryableCodes: [EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT, MALFORMED_RESPONSE]
